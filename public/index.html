<div id="studentView" class="app hidden">

  <main>
    <section class="page active" data-page="today">
      <div class="hero"><div class="hero-row"><div><div class="eyebrow" id="todayLabel"></div><h2 id="heroTitle">오늘</h2><p id="heroMsg"></p></div><div class="ring" id="todayRing"><b id="todayPct">0%</b></div></div></div>
      <div class="card"><h3><span>출결</span><span class="pill" id="attendancePill">미입실</span></h3><div class="metric-grid"><div class="metric"><small>입실</small><b id="inTime">-</b></div><div class="metric"><small>오늘 체류</small><b id="stayTime">0분</b></div></div><button class="big-action" id="attendanceBtn">입실하기</button></div>
      <div class="card"><h3><span>공부 기록</span><span class="pill blue" id="studyPill">대기 중</span></h3><div class="study-clock" id="studyTimer">00:00:00</div><div style="text-align:center;margin:-3px 0 14px"><b id="studySubject">대기</b><div class="muted" id="studyDetail" style="font-size:12px;margin-top:4px"></div></div><button class="big-action" id="studyBtn">공부 시작</button></div>
      <div class="section-head"><h2 class="section-title">오늘 할 일</h2><button class="add-mini" id="addTodoBtn">+ 할 일</button></div><div class="card" id="todayPlans"></div>
      <div class="card" id="todayLectureCard"><h3><span>오늘 인강</span></h3><div id="todayLectures"></div></div>
    </section>

    <section class="page" data-page="plan">
      <div class="hero"><div class="eyebrow">목표</div><h2>플랜</h2></div>
      <div class="tabs" id="planTabs"><button class="tab active" data-plan="long">장기</button><button class="tab" data-plan="month">월간</button><button class="tab" data-plan="week">주간</button></div>
      <div id="planGuide" class="parent-ref"></div>
      <div id="planList"></div>
      <button class="btn primary wide" id="addPlanBtn">+ 새 계획 만들기</button>
    </section>

    <section class="page" data-page="calendar">
      <div class="hero"><div class="eyebrow">일정과 기록</div><h2>캘린더</h2></div>
      <div class="card"><h3><span>이번 달 목표</span><small id="monthGoalCaption"></small></h3><div class="goal-strip" id="monthGoals"></div></div>
      <div class="card"><div class="calendar-head"><div class="cal-nav"><button class="iconbtn" id="calPrev">‹</button><button class="iconbtn" id="calNext">›</button></div><b id="calTitle"></b><div class="cal-mode"><button class="active" data-calmode="month">월간</button><button data-calmode="week">주간</button></div></div><div id="calendarArea"></div><div class="day-detail" id="dayDetail"></div></div>
      <div class="card"><h3><span>최근 7일</span></h3><div class="bar-chart" id="calendarStudyBars"></div></div>
    </section>

    <section class="page" data-page="progress">
      <div class="hero"><div class="eyebrow">학습 현황</div><h2>진행</h2><p id="progressHero"></p></div>
      <div class="card"><h3><span>이번 주</span><span class="pill good" id="streakPill">-</span></h3><div class="metric-grid"><div class="metric"><small>계획 진행</small><b id="weekPct">0%</b></div><div class="metric"><small>공부시간</small><b id="weekStudy">0분</b></div></div><div class="bar-chart" id="weekStudyBars"></div></div>
      <div class="card"><h3><span>목표 진행</span></h3><div id="subjectProgress"></div></div>
      <h2 class="section-title">로드맵</h2><div class="roadmap-wrap"><div class="roadmap" id="roadmap"></div></div>
    </section>

    <section class="page" data-page="lecture">
      <div class="hero"><div class="eyebrow">강의 루틴</div><h2>인강</h2></div>
      <div class="card" id="lectureList"></div><button class="btn primary wide" id="addLectureBtn">+ 인강 루틴 추가</button>
    </section>
  </main>
  <button class="fab" id="fab">＋</button>
  <nav class="bottom"><button class="nav active" data-page="today"><span>🏠</span>오늘</button><button class="nav" data-page="plan"><span>🗓️</span>플랜</button><button class="nav" data-page="calendar"><span>📅</span>캘린더</button><button class="nav" data-page="progress"><span>📈</span>진행</button><button class="nav" data-page="lecture"><span>▶️</span>인강</button></nav>
</div>

<div id="adminView" class="admin hidden">
  <header class="admin-top"><div class="admin-top-inner"><div class="brand"><div class="brandmark">S</div><div><b>STEPFLOW 관리자</b></div></div><div class="admin-actions"><button class="btn outline" id="pushBtn">알림 켜기</button><button class="btn outline" id="adminLogout">로그아웃</button></div></div></header>
  <main class="admin-main">
    <div class="admin-tabs"><button class="admin-tab active" data-admin-page="students">학생 관리</button><button class="admin-tab" data-admin-page="calendar">관리자 캘린더</button></div>
    <section id="adminStudentsPage">
      <div class="admin-grid"><div><div class="card"><h3><span>오늘 학생 현황</span><span><button class="tiny-btn" id="adminAddStudent">+ 학생 추가</button></span></h3><div id="studentCards"></div></div><div class="card"><h3><span>최근 알림</span><button class="tiny-btn" id="readNotiBtn">모두 읽음</button></h3><div id="adminNotifications"></div></div></div><div class="admin-detail"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 id="adminStudentTitle" style="margin:3px 0 0">학생을 선택해줘</h2></div><button class="btn primary" id="adminAddEvent">+ 중요 일정</button></div><div id="adminStudentDetail" style="margin-top:14px"></div></div></div>
    </section>
    <section id="adminCalendarPage" class="hidden">
      <div class="admin-cal-wrap"><div class="admin-toolbar"><div><h2 style="margin:3px 0 0">관리자 캘린더</h2></div><button class="btn primary" id="adminCalAdd">+ 일정</button></div><div class="calendar-head" style="margin-top:16px"><div class="cal-nav"><button class="iconbtn" id="adminCalPrev">‹</button><button class="iconbtn" id="adminCalNext">›</button></div><b id="adminCalTitle"></b><button class="btn outline" id="adminCalToday">오늘</button></div><div id="adminCalendarArea"></div><div id="adminCalendarDetail" class="day-detail"></div></div>
    </section>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TYPE_META={quantity:['개','수량'],page:['p','페이지'],lecture:['강','인강'],time:['분','시간'],check:['','완료형']};
const EVENT_META={mock:['📝','모의고사'],exam:['🎯','학교 시험'],performance:['📌','수행평가'],academy:['✏️','학원 시험'],assignment:['📚','과제·제출'],consult:['💬','상담'],other:['⭐','기타']};
const DAY_SHORT=['일','월','화','수','목','금','토']; const MONDAY_NAMES=['월','화','수','목','금','토','일'];
let user=null,payload=null,planTab='long',calCursor=null,calMode='month',selectedDate=null,timer=null,adminOverviewData=null,adminStudentId='',adminStudentPayload=null,adminPoll=null,lastAdminNotiId='',adminPage='students',adminCalCursor=null,adminCalSelected=null;
function pad(n){return String(n).padStart(2,'0')} function fromParts(y,m,d){return `${y}-${pad(m)}-${pad(d)}`}
function parseDate(s){const [y,m,d]=String(s||'').split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function isoDate(d){return fromParts(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
function addDays(s,n){const d=parseDate(s);d.setUTCDate(d.getUTCDate()+n);return isoDate(d)}
function todayISO(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${o.year}-${o.month}-${o.day}`}
function monthStart(s){const d=parseDate(s);return fromParts(d.getUTCFullYear(),d.getUTCMonth()+1,1)}
function monthEnd(s){const d=parseDate(s);return isoDate(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)))}
function mondayOf(s){const d=parseDate(s),day=d.getUTCDay();return addDays(s,-((day+6)%7))}
function fmtMD(s){if(!s)return'';const d=parseDate(s);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`}
function fmtKDate(s){if(!s)return'';const d=parseDate(s);return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${DAY_SHORT[d.getUTCDay()]}요일`}
function fmtHM(iso){if(!iso)return'-';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}
function secondsText(sec){sec=Math.max(0,Math.floor(Number(sec)||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}시간 ${m}분`:`${m}분`}
function clock(sec){sec=Math.max(0,Math.floor(sec));return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`}
function uid(p='id'){return `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch(_){}if(!r.ok){const e=new Error(j.error||'request_failed');e.status=r.status;throw e}return j}
function openModal(html){$('#modal').innerHTML=html;$('#modalBg').classList.add('show')}
function closeModal(){$('#modalBg').classList.remove('show');$('#modal').innerHTML=''}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function dayProgress(p){if(p.goalType==='check')return Number(p.completed||0)>=1?100:0;const t=Number(p.target||0);return t?Math.min(100,Math.round(Number(p.completed||0)/t*100)):0}
function isSimpleTodo(p){return p?.goalType==='todo'||Number.isFinite(Number(p?.allocationPct))}
function todoParentLevel(p){return p?.parentLevel||((p?.parentId)?'week':'')}
function groupGoalProgress(items){const groups={};for(const p of items){const k=p.goalId||p.id;if(!groups[k])groups[k]={total:Number(p.goalTotal||p.target||1),done:0};groups[k].done+=Number(p.completed||0)}const vals=Object.values(groups);if(!vals.length)return null;const total=vals.reduce((a,g)=>a+g.total,0),done=vals.reduce((a,g)=>a+Math.min(g.done,g.total),0);return total?Math.min(100,Math.round(done/total*100)):0}
function simpleTodoStats(items){const groups={};for(const p of items.filter(isSimpleTodo)){const k=p.goalId||p.id;if(!groups[k])groups[k]={total:Math.max(1,Number(p.goalTotal||100)),done:0,allocation:Math.max(0,Math.min(100,Number(p.allocationPct)||0))};groups[k].done+=Math.max(0,Number(p.completed||0));if(!groups[k].allocation&&Number(p.allocationPct)>0)groups[k].allocation=Math.max(0,Math.min(100,Number(p.allocationPct)||0))}const vals=Object.values(groups);const allocated=vals.reduce((a,g)=>a+g.allocation,0),contribution=vals.reduce((a,g)=>a+g.allocation*Math.min(1,g.done/g.total),0);return{has:vals.length>0,allocated,contribution}}
function mixedPlanProgress(direct,childProgress,manualProgress=0){if(!direct.has)return childProgress==null?Number(manualProgress||0):childProgress;const used=Math.min(100,direct.allocated),rest=Math.max(0,100-used),base=childProgress==null?Number(manualProgress||0):childProgress;return Math.min(100,Math.round(direct.contribution+base*rest/100))}
function calcProgress(level,item,data=payload?.data){if(!data)return 0;if(level==='day')return dayProgress(item);const direct=data.plans.day.filter(x=>x.parentId===item.id&&todoParentLevel(x)===level),todo=simpleTodoStats(direct);if(level==='week'){const legacy=direct.filter(x=>!isSimpleTodo(x));const legacyProgress=legacy.length?groupGoalProgress(legacy):null;return mixedPlanProgress(todo,legacyProgress,item.manualProgress)}if(level==='month'){const kids=data.plans.week.filter(x=>x.parentId===item.id),child=kids.length?Math.round(kids.reduce((a,k)=>a+calcProgress('week',k,data),0)/kids.length):null;return mixedPlanProgress(todo,child,item.manualProgress)}if(level==='long'){const kids=data.plans.month.filter(x=>x.parentId===item.id),child=kids.length?Math.round(kids.reduce((a,k)=>a+calcProgress('month',k,data),0)/kids.length):null;return mixedPlanProgress(todo,child,item.manualProgress)}return 0}
function allocationLabel(n){n=Number(n)||0;return n<=8?'아주 작은 분량':n<=18?'작은 분량':n<=35?'보통 분량':n<=60?'큰 분량':'아주 큰 분량'}
function todayPlans(data=payload?.data,date=todayISO()){return data?.plans?.day?.filter(p=>p.date===date)||[]}
function studySecondsOn(data,date){let n=(data.studySessions||[]).filter(s=>s.date===date).reduce((a,s)=>a+Number(s.seconds||0),0);if(data.activeStudy&&date===todayISO())n+=Math.max(0,Math.floor((Date.now()-new Date(data.activeStudy.startAt).getTime())/1000));return n}
function attendanceOn(data,date){const recs=(data.attendanceHistory||[]).filter(r=>r.date===date);const open=[...recs].reverse().find(r=>r.inAt&&!r.outAt);return{recs,open,first:recs[0]||null,last:[...recs].reverse()[0]||null}}
function currentStudySeconds(){if(!payload?.data.activeStudy)return 0;return Math.max(0,Math.floor((Date.now()-new Date(payload.data.activeStudy.startAt).getTime())/1000))}
function lectureDue(lec,date){if(lec.startDate&&date<lec.startDate)return false;if(lec.endDate&&date>lec.endDate)return false;return (lec.days||[]).includes(parseDate(date).getUTCDay())}
function allEventsOn(date,p=payload){const a=[...(p?.globalEvents||[]),...(p?.data?.events||[])];return a.filter(e=>e.startDate<=date&&e.endDate>=date)}

async function savePlans(){const r=await api('/api/plans',{method:'PUT',body:JSON.stringify({plans:payload.data.plans})});payload=r;renderCurrentStudent()}
async function saveLectures(){const r=await api('/api/lectures',{method:'PUT',body:JSON.stringify({lectures:payload.data.lectures})});payload=r;renderCurrentStudent()}

async function boot(){if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});try{const s=await api('/api/session');user=s.user;await enterUser()}catch(_){showLogin()}}
function showLogin(){user=null;payload=null;$('#loginView').classList.remove('hidden');$('#studentView').classList.add('hidden');$('#adminView').classList.add('hidden');clearInterval(adminPoll)}
async function enterUser(){$('#loginView').classList.add('hidden');if(user.role==='student'){clearInterval(adminPoll);$('#studentView').classList.remove('hidden');$('#adminView').classList.add('hidden');$('#studentName').textContent=user.displayName;payload=await api('/api/me');selectedDate=todayISO();calCursor=monthStart(selectedDate);navigate('today');startTimer()}else{$('#studentView').classList.add('hidden');$('#adminView').classList.remove('hidden');await loadAdmin();clearInterval(adminPoll);adminPoll=setInterval(loadAdmin,10000)}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('#loginId').value.trim().toLowerCase();try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({id})});user=r.user;await enterUser()}catch(_){toast('아이디를 확인해줘')}});
async function logout(){await api('/api/logout',{method:'POST'}).catch(()=>{});showLogin()}
$('#studentMenuBtn').onclick=()=>{openModal(`<h3>${esc(user?.displayName||'내 계정')}</h3><p class="muted">아이디: ${esc(user?.id||'')}</p><div class="modal-actions"><button class="cancel" id="closeAccount">닫기</button><button class="save" id="logoutStudent">로그아웃</button></div>`);$('#closeAccount').onclick=closeModal;$('#logoutStudent').onclick=logout};
$('#adminLogout').onclick=logout;

function navigate(p){$$('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderStudentPage(p);$('#fab').style.display=p==='progress'?'none':'block'}
$$('.nav').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function renderStudentPage(p){if(!payload)return;if(p==='today')renderToday();if(p==='plan')renderPlan();if(p==='calendar')renderCalendar();if(p==='progress')renderProgress();if(p==='lecture')renderLectures()}

function renderAdminCalendar(){if(!adminOverviewData)return;adminCalCursor=adminCalCursor||monthStart(todayISO());adminCalSelected=adminCalSelected||todayISO();const ms=monthStart(adminCalCursor),first=parseDate(ms).getUTCDay(),start=addDays(ms,-first),month=parseDate(ms).getUTCMonth()+1,events=adminOverviewData.adminCalendarEvents||[];$('#adminCalTitle').textContent=`${parseDate(ms).getUTCFullYear()}년 ${month}월`;let h='<div class="weekdays">'+DAY_SHORT.map(x=>`<div>${x}</div>`).join('')+'</div><div class="cal-grid admin-calendar">';for(let i=0;i<42;i++){const date=addDays(start,i),dd=parseDate(date),other=dd.getUTCMonth()+1!==month,ev=events.filter(e=>e.startDate<=date&&e.endDate>=date);h+=`<button class="daycell ${other?'other':''} ${date===adminCalSelected?'selected':''}" data-admin-cal-date="${date}"><div class="daynum">${dd.getUTCDate()}</div><div class="daymeta">${ev.length?'<span class="event-dot"></span>'+esc(ev[0].title):''}</div><div class="daymeta">${ev.length>1?`+${ev.length-1}개`:''}</div></button>`}h+='</div>';$('#adminCalendarArea').innerHTML=h;$$('[data-admin-cal-date]').forEach(b=>b.onclick=()=>{adminCalSelected=b.dataset.adminCalDate;renderAdminCalendar()});const selected=events.filter(e=>e.startDate<=adminCalSelected&&e.endDate>=adminCalSelected).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('#adminCalendarDetail').innerHTML=`<div class="section-head"><h3 class="section-title">${fmtKDate(adminCalSelected)}</h3><button class="add-mini" id="adminCalAddDay">+ 일정</button></div>${selected.length?selected.map(e=>`<div class="admin-cal-event ${e.importance==='critical'?'critical':e.importance==='important'?'important':''}"><div class="admin-record-top"><div><b>${esc(e.title)}</b><small>${e.time?e.time+' · ':''}${e.startDate!==e.endDate?fmtMD(e.startDate)+'~'+fmtMD(e.endDate):''}${e.reminderAt?' · 🔔 알림 설정됨':''}</small>${e.note?`<small>${esc(e.note)}</small>`:''}</div><div class="row-actions" style="margin-top:0"><button class="tiny-btn" d function reminderPresetIso(startDate,time,preset,custom){if(preset==='none')return'';if(preset==='custom')return kstInputToIso(custom);let d=startDate,h=9,m=0;if(preset==='day9'){h=9;m=0}else if(preset==='prev19'){d=addDays(startDate,-1);h=19;m=0}else if(preset==='hour1'){const base=kstInputToIso(`${startDate}T${time||'09:00'}`);return base?new Date(new Date(base).getTime()-3600000).toISOString():''}return kstInputToIso(`${d}T${pad(h)}:${pad(m)}`)}
function openAdminCalendarEvent(id=''){const old=(adminOverviewData.adminCalendarEvents||[]).find(e=>e.id===id),date=old?.startDate||adminCalSelected||todayISO(),preset=old?.reminderAt?'custom':'none';openModal(`<h3>${old?'관리자 일정 수정':'일정 추가'}</h3><div class="field"><label>일정 이름</label><input id="aceTitle" value="${esc(old?.title||'')}" placeholder="예: 9월 모의고사"></div><div class="grid2"><div class="field"><label>시작일</label><input id="aceStart" type="date" value="${date}"></div><div class="field"><label>종료일</label><input id="aceEnd" type="date" value="${old?.endDate||date}"></div></div><div class="grid2"><div class="field"><label>시간 (선택)</label><input id="aceTime" type="time" value="${old?.time||''}"></div><div class="field"><label>중요도</label><select id="aceImp"><option value="normal" ${old?.importance==='normal'?'selected':''}>보통</option><option value="important" ${old?.importance==='important'?'selected':''}>중요</option><option value="critical" ${old?.importance==='critical'?'selected':''}>매우 중요</option></select></div></div><div class="field"><label>알림</label><select id="aceReminder"><option value="none">알림 없음</option><option value="day9">당일 오전 9시</option><option value="prev19">1일 전 오후 7시</option><option value="hour1">일정 1시간 전</option><option value="custom" ${preset==='custom'?'selected':''}>직접 설정</option></select></div><div class="field ${preset==='custom'?'':'hidden'}" id="aceCustomWrap"><label>직접 알림 시간</label><input id="aceCustom" type="datetime-local" value="${old?.reminderAt?localInputValue(old.reminderAt):''}"></div><div class="field"><label>메모</label><textarea id="aceNote" placeholder="관리자 메모">${esc(old?.note||'')}</textarea></div><div class="modal-actions"><button class="cancel" id="aceCancel">취소</button><button class="save" id="aceSave">저장</button></div>`);$('#aceReminder').onchange=()=>$('#aceCustomWrap').classList.toggle('hidden',$('#aceReminder').value!=='custom');$('#aceStart').onchange=()=>{if($('#aceEnd').value<$('#aceStart').value)$('#aceEnd').value=$('#aceStart').value};$('#aceCancel').onclick=closeModal;$('#aceSave').onclick=async()=>{const title=$('#aceTitle').value.trim(),startDate=$('#aceStart').value,endDate=$('#aceEnd').value,time=$('#aceTime').value;if(!title||!startDate)return toast('일정 이름과 날짜를 확인해줘');const reminderAt=reminderPresetIso(startDate,time,$('#aceReminder').value,$('#aceCustom').value),event={title,startDate,endDate,time,importance:$('#aceImp').value,note:$('#aceNote').value.trim(),reminderAt};try{if(old)await api('/api/admin/calendar-event/'+encodeURIComponent(old.id),{method:'PUT',body:JSON.stringify({event})});else await api('/api/admin/calendar-event',{method:'POST',body:JSON.stringify({event})});closeModal();await loadAdmin();renderAdminCalendar();toast('저장됨')}catch(_){toast('저장 실패')}}}
async function deleteAdminCalendarEvent(id){if(!confirm('이 관리자 일정을 삭제할까?'))return;await api('/api/admin/calendar-event/'+encodeURIComponent(id),{method:'DELETE'});await loadAdmin();renderAdminCalendar();toast('일정을 삭제했어')}
$('#adminCalPrev').onclick=()=>{adminCalCursor=monthStart(addDays(monthStart(adminCalCursor||todayISO()),-1));renderAdminCalendar()};$('#adminCalNext').onclick=()=>{const d=parseDate(monthStart(adminCalCursor||todayISO()));adminCalCursor=fromParts(d.getUTCFullYear(),d.getUTCMonth()+2,1);renderAdminCalendar()};$('#adminCalToday').onclick=()=>{adminCalCursor=monthStart(todayISO());adminCalSelected=todayISO();renderAdminCalendar()};$('#adminCalAdd').onclick=()=>openAdminCalendarEvent();
$('#adminAddEvent').onclick=()=>openEventModal(true);$('#readNotiBtn').onclick=async()=>{await api('/api/admin/notifications/read',{method:'POST'});await loadAdmin();toast('알림을 읽음 처리했어')};
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
$('#pushBtn').onclick=async()=>{try{if(!('Notification'in window)||!('serviceWorker'in navigator))return toast('이 브라우저는 알림을 지원하지 않아');const perm=await Notification.requestPermission();if(perm!=='granted')return toast('알림 권한이 필요해');const k=await api('/api/push/public-key');if(!k.available){toast('앱을 열어둔 동안 알림을 받을 수 있어');return}const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(k.publicKey)});await api('/api/push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub})});toast('관리자 푸시 알림을 켰어 🔔');$('#pushBtn').textContent='🔔 알림 사용 중'}catch(e){console.error(e);toast('알림 설정에 실패했어. 홈 화면 앱에서 다시 시도해줘')}};

boot();
})();
</script>
